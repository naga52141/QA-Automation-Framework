name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java (for Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Allure commandline
        run: |
          curl -sL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: |
          mkdir -p reports screenshots allure-results
          pytest -n auto -v --html=reports/report.html --self-contained-html --alluredir=allure-results

      - name: Commit auto-generated visual-regression baselines, if any
        # Baselines must be captured on this same Linux CI environment to
        # be a meaningful comparison target -- a macOS-captured baseline
        # produced large false-positive diffs against Linux's font
        # rendering (verified: ~24% on an unchanged page). When a
        # baseline file doesn't exist yet, compare_screenshot() creates
        # it and passes trivially; this step persists that CI-native
        # baseline back to the repo so future runs have something real
        # to compare against, instead of it vanishing with the runner.
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git checkout -B main
          git add baselines/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-regenerate visual regression baselines (Linux CI-native)"
            git push origin main
          fi

      - name: Fetch previous Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry history into this run's results
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/ 2>/dev/null || true

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/report.html

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  cross-browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: safari

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Enable Safari WebDriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p reports screenshots
          pytest -v -m "not visual" --browser=${{ matrix.browser }} --html=reports/report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: reports/report-${{ matrix.browser }}.html

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
